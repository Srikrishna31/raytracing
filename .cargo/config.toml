# .cargo/config.toml
# This file overrides any user-level Cargo configuration
# to ensure reproducible builds with Bazel

[build]
# These settings will be used by Bazel's cargo_build_script rule
rustc-wrapper = ""

[registry]
default = "crates-io"

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
git-fetch-with-cli = true
offline = false

# Disable any potential .cargo/credentials from the user's home directory
[registry.token]
crates-io = ""
# On Windows
# ```
# cargo install -f cargo-binutils
# rustup component add llvm-tools-preview
# ```
[target.x86_64-pc-windows-msvc]
rustflags=["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-gnu]
rustflags=["-C", "link-arg=-fuse-ld=lld"]


# On Linux
# ```
# - Ubuntu, `sudo apt install lld clang`
# - Arch, `sudo pacman -S lld clang`
[target.x86_64-unknown-linux-gnu]
rustflags=["-C", "linker=clang", "-C", "link-arg=-fuse-ld=lld"]

# On MacOS, `brew install michaeleisel/zld/zld
[target.x86_64-apple-darwin]
rustflags=["-C", "link-arg=-fuse-ld=/usr/local/bin/zld"]

[target.aarch64-apple-darwin]
rustflags=["-C", "link-arg=-fuse-ld=/usr/local/bin/zld"]
